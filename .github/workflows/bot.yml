name: Telegram Bot Runner (Manager)

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 */5 * * *"   # har 5 ghante auto-restart (GH ka 6-hour hard limit se pehle)

concurrency:
  group: telegram-bot-manager
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  run-bot:
    name: Run Manager Bot (Telegram listener)
    runs-on: ubuntu-latest
    timeout-minutes: 340

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.1.2 torchvision==0.16.2
          pip install -r requirements.txt

      - name: Run manager bot
        env:
          PYTHONUNBUFFERED: '1'
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          OWNER_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
          ARCHIVE_CHANNEL_ID: ${{ secrets.ARCHIVE_CHANNEL_ID }}
          GH_PAT: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: python -u bot.py
