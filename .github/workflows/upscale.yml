name: Telegram Anime Upscaler v10
on:
  workflow_dispatch:
jobs:
  run-bot:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Cache weights + DDColor
        uses: actions/cache@v4
        with:
          path: weights
          key: weights-v10

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.1.2 torchvision==0.16.2
          pip install -r requirements.txt

      - name: Install Real-ESRGAN
        run: |
          git clone --depth 1 https://github.com/xinntao/Real-ESRGAN.git realesrgan-src
          cd realesrgan-src
          pip install -e . --no-deps
          cd ..

      - name: Install DDColor
        run: |
          git clone --depth 1 https://github.com/piddnad/DDColor.git ddcolor-src || \
          git clone --depth 1 https://github.com/ai-anchorite/DDColor.git ddcolor-src
          cd ddcolor-src
          pip install -e . --no-deps || echo "⚠️ DDColor pip install failed (non-critical)"
          cd ..

      - name: Download upscale models
        shell: bash
        run: |
          mkdir -p weights && cd weights

          dl() {
            local url="$1" out="$2"
            if [ -s "$out" ]; then echo "✓ $out cached"; return 0; fi
            echo "⬇️  $out"
            wget -q --show-progress --timeout=90 -O "$out" "$url"
          }

          dl "https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesr-animevideov3.pth" \
             "realesr-animevideov3.pth"
          dl "https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.2.4/RealESRGAN_x4plus_anime_6B.pth" \
             "RealESRGAN_x4plus_anime_6B.pth"
          dl "https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesr-general-x4v3.pth" \
             "realesr-general-x4v3.pth"
          dl "https://github.com/xinntao/Real-ESRGAN/releases/download/v0.1.0/RealESRGAN_x4plus.pth" \
             "RealESRGAN_x4plus.pth"

          for f in realesr-animevideov3.pth RealESRGAN_x4plus_anime_6B.pth \
                   realesr-general-x4v3.pth RealESRGAN_x4plus.pth; do
            [ -s "$f" ] || { echo "❌ Missing: $f"; exit 1; }
          done
          echo "✅ All 4 upscale models present"
          ls -lh

      - name: Download DDColor models (both Fast + High)
        shell: bash
        run: |
          cd weights

          # --- DDColor Fast (tiny, ~215MB) ---
          if [ ! -s ddcolor_tiny.pth ]; then
            echo "⬇️  DDColor Fast (tiny)..."
            wget -q --show-progress --timeout=120 \
              "https://huggingface.co/piddnad/ddcolor_paper_tiny/resolve/main/pytorch_model.bin" \
              -O ddcolor_tiny.pth || echo "⚠️ tiny fail"
          fi

          # --- DDColor High (modelscope, ~870MB) ---
          if [ ! -s ddcolor_high.pth ]; then
            echo "⬇️  DDColor High (modelscope, this takes a few minutes)..."
            wget -q --show-progress --timeout=300 \
              "https://huggingface.co/piddnad/ddcolor_modelscope/resolve/main/pytorch_model.bin" \
              -O ddcolor_high.pth || echo "⚠️ high fail"
          fi

          echo "=== weights/ ==="
          ls -lh
          for f in ddcolor_tiny.pth ddcolor_high.pth; do
            if [ -s "$f" ]; then echo "✅ $f OK"
            else echo "⚠️  $f missing (colorize limited)"; fi
          done

      - name: Run Telegram bot
        env:
          PYTHONUNBUFFERED: '1'
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          OWNER_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
          ARCHIVE_CHANNEL_ID: ${{ secrets.ARCHIVE_CHANNEL_ID }}
        run: python -u bot.py
