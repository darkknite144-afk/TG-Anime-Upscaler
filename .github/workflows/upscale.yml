name: Telegram Anime Upscaler 20W

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Unique Job ID (e.g., manual-test-01)"
        required: true
        type: string
        default: "manual-test-001"
      filename:
        description: "Output Filename"
        required: true
        type: string
        default: "upscaled_output.mp4"
      model:
        description: "Model Selection"
        required: true
        type: choice
        options:
          - anime_video
          - anime_image
          - game
          - real
        default: "anime_video"
      scale:
        description: "Upscale Scale"
        required: true
        type: choice
        options:
          - "2"
          - "4"
        default: "2"
      preset:
        description: "Quality Preset (balanced = Medium)"
        required: true
        type: choice
        options:
          - fast
          - balanced
          - best
        default: "balanced"
      audio:
        description: "Audio Mode"
        required: true
        type: choice
        options:
          - keep
          - compress
          - remove
        default: "keep"
      colorize:
        description: "Colorize Mode"
        required: true
        type: choice
        options:
          - "off"
          - "fast"
          - "high"
        default: "off"
      workers:
        description: "Number of Workers"
        required: true
        type: choice
        options:
          - "1"
          - "2"
          - "4"
          - "8"
          - "10"
          - "12"
          - "15"
          - "20"
        default: "20"
      start_window:
        description: "Startup window (seconds)"
        required: true
        type: string
        default: "420"

permissions:
  contents: read
  actions: read

env:
  MAX_WORKERS: 20
  PYTHONUNBUFFERED: "1"
  OMP_NUM_THREADS: "4"
  MKL_NUM_THREADS: "4"

jobs:
  worker:
    name: Worker ${{ matrix.worker }}
    runs-on: ubuntu-latest
    timeout-minutes: 420
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        worker: ${{ fromJSON(format('[{0}]', join(',', range(0, 20)))) }}

    env:
      WORKER_INDEX: ${{ matrix.worker }}
      TOTAL_WORKERS: ${{ inputs.workers }}
      JOB_ID: ${{ inputs.job_id }}
      FILENAME: ${{ inputs.filename }}
      MODEL_KEY: ${{ inputs.model }}
      SCALE: ${{ inputs.scale }}
      PRESET: ${{ inputs.preset }}
      MAX_FRAMES: "3600"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check worker assignment
        id: assign
        run: |
          python - <<'PY'
          import os
          wid=int(os.environ["WORKER_INDEX"])
          workers=int(os.environ["TOTAL_WORKERS"])
          if wid>=workers:
              print("SKIP=true",file=open(os.environ["GITHUB_OUTPUT"],"a"))
              raise SystemExit(0)
          print("SKIP=false",file=open(os.environ["GITHUB_OUTPUT"],"a"))
          PY

      - name: Install system packages
        if: ${{ steps.assign.outputs.SKIP != 'true' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg python3-pip
          python -m pip install --upgrade pip

      - name: Install Python packages
        if: ${{ steps.assign.outputs.SKIP != 'true' }}
        run: |
          pip install numpy==1.26.4 opencv-python-headless==4.9.0.80 Pillow==10.4.0 tqdm==4.66.5 requests
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install basicsr==1.4.2 realesrgan

      - name: Wait for input video artifact
        if: ${{ steps.assign.outputs.SKIP != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import os, time, requests, sys, zipfile, shutil
          repo = os.environ["GITHUB_REPOSITORY"]
          run_id = os.environ["GITHUB_RUN_ID"]
          token = os.environ["GH_TOKEN"]
          headers = {"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json"}
          url = f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/artifacts"
          
          print("⏳ Waiting for input-video artifact...")
          max_wait = 600
          start_time = time.time()
          
          while True:
              if time.time() - start_time > max_wait:
                  print("❌ Timeout waiting for input-video artifact!")
                  sys.exit(1)
                  
              r = requests.get(url, headers=headers, timeout=30)
              if r.status_code == 200:
                  arts = r.json().get("artifacts", [])
                  for a in arts:
                      if a["name"] == "input-video":
                          print("✅ Artifact found! Downloading...")
                          dl_url = a["archive_download_url"]
                          with requests.get(dl_url, headers=headers, stream=True, timeout=120) as dl:
                              dl.raise_for_status()
                              with open("input_video.zip", "wb") as f:
                                  for chunk in dl.iter_content(1024*1024):
                                      f.write(chunk)
                          print("✅ Downloaded. Extracting...")
                          with zipfile.ZipFile("input_video.zip", "r") as z:
                              z.extractall("temp_input")
                          os.makedirs("worker_work", exist_ok=True)
                          for root, dirs, files in os.walk("temp_input"):
                              for f in files:
                                  if f == "source_video" or f.endswith(".mp4"):
                                      shutil.move(os.path.join(root, f), "worker_work/source")
                                      break
                          print("✅ Extracted and placed at worker_work/source")
                          sys.exit(0)
              time.sleep(10)
          PY

      - name: Run worker
        if: ${{ steps.assign.outputs.SKIP != 'true' }}
        run: python distributed_worker.py

      - name: Upload worker artifact
        if: ${{ steps.assign.outputs.SKIP != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: worker-${{ matrix.worker }}
          path: worker_output
          retention-days: 1
          if-no-files-found: error

  collect:
    name: Collect and Build
    needs: worker
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Download input video
        uses: actions/download-artifact@v4
        with:
          name: input-video
          path: input

      - name: Download all worker outputs
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: worker-*
          path: workers
          merge-multiple: false

      - name: Merge video chunks using FFmpeg
        env:
          WORKERS: ${{ inputs.workers }}
        run: |
          > concat_list.txt
          for ((i=0; i<$WORKERS; i++)); do
            echo "file 'workers/worker-$i/worker_$(printf "%02d" $i).mp4'" >> concat_list.txt
          done
          cat concat_list.txt
          ffmpeg -y -f concat -safe 0 -i concat_list.txt -c copy output_no_audio.mp4

      - name: Restore original audio
        run: |
          if [ -f input/source_video ]; then
            SOURCE=input/source_video
          else
            SOURCE=$(find input -name "*.mp4" | head -n 1)
          fi
          ffmpeg -y \
            -i output_no_audio.mp4 \
            -i "$SOURCE" \
            -map 0:v:0 -map 1:a? \
            -c:v copy -c:a aac -b:a 192k \
            -shortest final_upscaled.mp4

      - name: Upload final
        uses: actions/upload-artifact@v4
        with:
          name: final-${{ inputs.job_id }}
          path: final_upscaled.mp4
          retention-days: 7
          if-no-files-found: error
